<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legend Four - Marketplace Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #0f172a;
            color: white;
        }

        .auth-container {
            position: fixed;
            inset: 0;
            background: #020617;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .auth-box {
            width: 350px;
            background: #111827;
            padding: 30px;
            border-radius: 15px;
            border: 1px solid #334155;
        }

        .auth-box h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #3b82f6;
        }

        .auth-box input {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            background: #1e293b;
            border: none;
            border-radius: 8px;
            color: white;
        }

        .auth-box button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #2563eb;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .auth-box p {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .auth-box span {
            color: #60a5fa;
            cursor: pointer;
        }

        .navbar {
            background: #111827;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #3b82f6;
            cursor: pointer;
        }

        .menu {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .menu button {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            background: #1e293b;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }

        .menu button:hover {
            background: #334155;
        }

        .btn-cart {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #1e293b;
            border: 1px solid #334155;
            color: #fff;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-cart:hover {
            background: #2563eb;
            border-color: #3b82f6;
        }

        .profile-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #1e293b;
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: 0.2s;
            position: relative;
        }

        .profile-box:hover {
            border-color: #3b82f6;
            background: #1e293bde;
        }

        .profile-img {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #3b82f6;
        }

        .profile-name {
            font-size: 14px;
            font-weight: bold;
        }

        .search-box {
            padding: 20px 30px;
            display: flex;
            gap: 15px;
        }

        .search-box input {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #1e293b;
            color: white;
        }

        .search-box select {
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #1e293b;
            color: white;
            cursor: pointer;
            outline: none;
        }

        .banner {
            margin: 0 auto 30px;
            max-width: 1200px;   
            width: calc(100% - 60px); 
            height: auto;        
            aspect-ratio: 16 / 9; 
            overflow: hidden;
            border-radius: 15px;
            border: 1px solid #334155;
            background: #020617;
            position: relative;
            padding: 0;
        }

        .slides {
            display: none;
            width: 100%;
            height: 100%;
        }

        .slides img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
        }

        .container {
            max-width: 1200px;   
            margin: 0 auto;      
            padding: 0 30px 40px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); 
            gap: 25px; 
        }

        @media (max-width: 768px) {
            .product-grid {
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            }
            .navbar {
                padding: 15px 15px;
            }
            .search-box {
                flex-direction: column;
            }
        }

        .card {
            background: #1e293b;
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid #334155;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-image {
            width: 100%;
            height: 160px;
            cursor: pointer;
        }

        .card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-body {
            padding: 15px;
        }

        .game {
            color: #60a5fa;
            font-size: 12px;
            font-weight: bold;
        }

        .card-title {
            margin-top: 8px;
            font-size: 16px;
        }

        .price {
            margin-top: 12px;
            color: #22c55e;
            font-weight: bold;
        }

        .card button {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background: #2563eb;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
        }

        .cart-page {
            display: none;
            padding: 30px;
        }

        .cart-item {
            background: #1e293b;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Desain Tambahan untuk Tombol Kuantitas */
        .qty-control {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .qty-btn {
            background: #334155;
            color: white;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .qty-btn:hover {
            background: #475569;
        }

        .qty-number {
            font-weight: bold;
            font-size: 15px;
            min-width: 20px;
            text-align: center;
        }

        .total-box {
            background: #111827;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .checkout-btn {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #22c55e;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .footer {
            background: #111827;
            padding: 40px 20px;
            text-align: center;
            border-top: 1px solid #334155;
            margin-top: 50px;
        }

        .footer h2 {
            color: #3b82f6;
            margin-bottom: 10px;
        }

        .footer p {
            color: #94a3b8;
            margin-bottom: 20px;
        }

        .footer-logos {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .social-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 45px;
            background: #1e293b;
            color: #94a3b8;
            border-radius: 50%;
            border: 1px solid #334155;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .social-icon:hover {
            color: #fff;
            background: #2563eb;
            transform: translateY(-3px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .footer small {
            color: #64748b;
        }

        .hidden {
            display: none;
        }

        #toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #22c55e;
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            opacity: 0;
            transition: 0.3s;
            z-index: 9999;
            pointer-events: none;
        }

        #toast.show {
            opacity: 1;
        }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 99999;
        }

        .modal-content {
            width: 90%;
            max-width: 500px;
            background: #111827;
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid #334155;
        }

        .modal-image {
            width: 100%;
            height: 250px;
        }

        .modal-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .modal-body {
            padding: 20px;
        }

        .modal-body h2 {
            margin-bottom: 10px;
        }

        .close-btn {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            background: #ef4444;
            color: white;
            cursor: pointer;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>

<div id="toast"></div>

<div id="loading" style="position:fixed; inset:0; background:rgba(0,0,0,0.8); display:none; justify-content:center; align-items:center; flex-direction:column; z-index:99999;">
    <div style="width:60px; height:60px; border:6px solid #334155; border-top:6px solid #3b82f6; border-radius:50%; animation:spin 1s linear infinite;"></div>
    <p style="margin-top:20px; font-size:18px; font-weight:bold;">Memproses Pembayaran...</p>
</div>

<div class="auth-container" id="authContainer">
    <div class="auth-box" id="registerBox">
        <h1>LEGEND FOUR</h1>
        <input type="text" placeholder="Username" id="regUser">
        <input type="password" placeholder="Password" id="regPass">
        <button onclick="register()">Daftar</button>
        <p>Sudah punya akun? <span onclick="showLogin()">Login</span></p>
    </div>

    <div class="auth-box hidden" id="loginBox">
        <h1>LEGEND FOUR</h1>
        <input type="text" placeholder="Username" id="loginUser">
        <input type="password" placeholder="Password" id="loginPass">
        <button onclick="login()">Masuk</button>
    </div>
</div>

<div id="mainApp" class="hidden">
    <div class="navbar">
        <div class="logo" onclick="showHome()">LEGEND FOUR</div>
        <div class="menu">
            <button class="btn-cart" onclick="showCart()" title="Keranjang Belanja">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
                <span id="cartCount">0</span>
            </button>
            <button onclick="logout()">Logout</button>
            
            <div class="profile-box" onclick="openProfileModal()" title="Klik untuk ubah profil">
                <img src="https://i.pravatar.cc/100" class="profile-img" id="userAvatar" alt="Profile">
                <div class="profile-name" id="displayProfileName">Player One</div>
            </div>
        </div>
    </div>

    <div class="search-box">
        <input type="text" placeholder="Cari akun game..." id="searchInput" onkeyup="searchProduct()">
        <select id="gameFilter" onchange="searchProduct()">
            <option value="ALL">Semua Game</option>
            <option value="Mobile Legends">Mobile Legends</option>
            <option value="Free Fire">Free Fire</option>
        </select>
    </div>

    <div id="homePage">
        <div class="banner">
            <div class="slides fade">
                <img src="images/banner_utama.jpeg" alt="Legend Four Game">
            </div>
            <div class="slides fade">
                <img src="images/nexora.jpeg" alt="Nexora Esports">
            </div>
             <div class="slides fade">
                <img src="images/lunaris.jpeg" alt="lunaris Esports">
            </div>
             <div class="slides fade">
                <img src="images/nexus.jpeg" alt="Nexus Esports">
            </div>
        </div>
        
        <div class="container">
            <div class="product-grid" id="productGrid"></div>
        </div>
    </div>

    <div class="cart-page" id="cartPage">
        <h2>Keranjang Belanja</h2>
        <br>
        <div id="cartList"></div>
        <div class="total-box">
            <h3>Total: <span id="totalPrice">Rp 0</span></h3>
            <button class="checkout-btn" onclick="checkout()">Checkout via Midtrans</button>
        </div>
    </div>
</div>

<div class="modal" id="productModal">
    <div class="modal-content">
        <div class="modal-image">
            <img id="modalImg" alt="Product">
        </div>
        <div class="modal-body">
            <h2 id="modalTitle"></h2>
            <p id="modalGame"></p>
            <br>
            <h3 id="modalPrice"></h3>
            <button class="checkout-btn" id="buyNowBtn">Tambah ke Cart</button>
            <button class="close-btn" onclick="closeModal()">Tutup</button>
        </div>
    </div>
</div>

<div class="modal" id="editProfileModal">
    <div class="modal-content" style="max-width: 400px; padding: 25px;">
        <h2 style="text-align: center; margin-bottom: 20px; color: #3b82f6;">Edit Profil</h2>
        <div style="text-align: center; margin-bottom: 15px;">
            <img src="https://i.pravatar.cc/100" id="previewAvatar" style="width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 3px solid #3b82f6;">
        </div>
        <label style="font-size: 13px; color: #94a3b8;">Ganti Nama User:</label>
        <input type="text" id="editNameInput" style="width: 100%; padding: 10px; margin: 8px 0 15px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; color: white;">
        
        <label style="font-size: 13px; color: #94a3b8;">Ganti Foto Profil (Pilih File Lokal):</label>
        <input type="file" id="editAvatarInput" accept="image/*" onchange="previewImage(event)" style="width: 100%; margin: 8px 0 20px; color: #94a3b8; font-size: 14px;">
        
        <button class="checkout-btn" style="margin-top: 5px;" onclick="saveProfile()">Simpan Perubahan</button>
        <button class="close-btn" style="background: #475569;" onclick="closeProfileModal()">Batal</button>
    </div>
</div>

<footer class="footer">
    <h2>LEGEND FOUR Game</h2>
    <p>Marketplace jual beli akun game aman dan terpercaya.</p>
    <div class="footer-logos">
        <a href="https://instagram.com" target="_blank" class="social-icon" title="Instagram">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
            </svg>
        </a>
        <a href="https://wa.me/" target="_blank" class="social-icon" title="WhatsApp">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
            </svg>
        </a>
    </div>
    <small>© 2026 Legend Four. All Rights Reserved. </small>
</footer>

<script type="text/javascript" src="https://app.sandbox.midtrans.com/snap/snap.js" data-client-key="Mid-client-WEeXpDQan0i5fZdH"></script>

<script>
const products = [
    { id: 1, game: "Mobile Legends", title: "Akun ML Mythical Glory", price: 670000, image: "https://images.unsplash.com/photo-1612287230202-1bf1d85d1bdf?q=80&w=500", discount: "DISKON 50%", status: "READY", badge: "BEST SELLER", rating: "★★★★★" },
    { id: 2, game: "Free Fire", title: "Akun Sultan FF Full Evo", price: 1500000, image: "https://images.unsplash.com/photo-1589241062272-c0a000072dfa?q=80&w=500", discount: "DISKON 20%", status: "LIMITED", badge: "HOT ITEM", rating: "★★★★" },
    { id: 3, game: "Mobile Legends", title: "Akun ML Skin Collector", price: 1000000, image: "https://images.unsplash.com/photo-1553481187-be93c21490a9?q=80&w=500", discount: "DISKON 50%", status: "READY", badge: "BEST SELLER", rating: "★★★★★" },
    { id: 4, game: "Mobile Legends", title: "Akun ML Tier Mythic V", price: 120000, image: "https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=500", discount: "DISKON 10%", status: "READY", badge: "BEST SELLER", rating: "★★★★★" }, 
    { id: 5, game: "Free Fire", title: "Akun FF Tier Master Murah", price: 250000, image: "https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=500", discount: "DISKON 15%", status: "READY", badge: "POPULER", rating: "★★★★" },
    { id: 6, game: "Mobile Legends", title: "Akun ML All Hero Max", price: 800000, image: "https://images.unsplash.com/photo-1614028674026-a65e31bfd27c?q=80&w=500", discount: "DISKON 30%", status: "READY", badge: "BEST SELLER", rating: "★★★★★" },
    { id: 7, game: "Mobile Legends", title: "Starter Akun ML Murah", price: 10000, image: "https://images.unsplash.com/photo-1552820728-8b83bb6b773f?q=80&w=500", discount: "HARGA PAS", status: "READY", badge: "PROMO", rating: "★★★★★" }
];

let cart = []; // Array ini sekarang menyimpan objek produk berserta properti 'quantity'
let slideIndex = 0; 
let base64Avatar = ""; 

function showSlides() {
    let slides = document.getElementsByClassName("slides");
    for (let i = 0; i < slides.length; i++) {
        slides[i].style.display = "none";  
    }
    slideIndex++;
    if (slideIndex > slides.length) { slideIndex = 1 }    
    if(slides[slideIndex-1]) {
        slides[slideIndex-1].style.display = "block";  
    }
    setTimeout(showSlides, 4000); 
}

window.onload = function() {
    const isLogin = localStorage.getItem("isLogin");
    if (isLogin === "true") {
        document.getElementById("authContainer").classList.add("hidden");
        document.getElementById("mainApp").classList.remove("hidden");
        renderProducts(products);
        showSlides(); 
        
        const localName = localStorage.getItem("profileName");
        const localAvatar = localStorage.getItem("profileAvatar");
        if (localName) document.getElementById("displayProfileName").innerText = localName;
        if (localAvatar) {
            document.getElementById("userAvatar").src = localAvatar;
            document.getElementById("previewAvatar").src = localAvatar;
        }
    }
}

function openProfileModal() {
    document.getElementById("editNameInput").value = document.getElementById("displayProfileName").innerText;
    document.getElementById("editProfileModal").style.display = "flex";
}

function closeProfileModal() {
    document.getElementById("editProfileModal").style.display = "none";
    document.getElementById("editAvatarInput").value = ""; 
}

function previewImage(event) {
    const reader = new FileReader();
    reader.onload = function() {
        document.getElementById("previewAvatar").src = reader.result;
        base64Avatar = reader.result; 
    }
    if(event.target.files[0]) {
        reader.readAsDataURL(event.target.files[0]);
    }
}

function saveProfile() {
    const newName = document.getElementById("editNameInput").value.trim();
    if(newName === "") {
        showToast("Nama tidak boleh kosong!");
        return;
    }
    
    document.getElementById("displayProfileName").innerText = newName;
    localStorage.setItem("profileName", newName);
    
    if(base64Avatar !== "") {
        document.getElementById("userAvatar").src = base64Avatar;
        localStorage.setItem("profileAvatar", base64Avatar);
    }
    
    closeProfileModal();
    showToast("Profil Berhasil Diperbarui!");
}

async function register() {
    const user = document.getElementById("regUser").value;
    const pass = document.getElementById("regPass").value;
    try {
        const response = await fetch("http://localhost:3000/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: user, password: pass })
        });
        const data = await response.json();
        if (data.success) {
            showToast("Register berhasil!");
            showLogin();
        } else {
            showToast(data.message || "Register gagal!");
        }
    } catch (error) {
        console.log(error);
        showToast("Server error!");
    }
}

async function login() {
    const user = document.getElementById("loginUser").value;
    const pass = document.getElementById("loginPass").value;
    try {
        const response = await fetch("http://localhost:3000/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: user, password: pass })
        });
        const data = await response.json();
        if (data.success) {
            document.getElementById("authContainer").classList.add("hidden");
            document.getElementById("mainApp").classList.remove("hidden");
            localStorage.setItem("isLogin", "true");
            renderProducts(products);
            showSlides(); 
            showToast("Login berhasil!");
            
            if(!localStorage.getItem("profileName")) {
                document.getElementById("displayProfileName").innerText = user;
                localStorage.setItem("profileName", user);
            }
        } else {
            showToast(data.message || "Username atau password salah!");
        }
    } catch (error) {
        console.log(error);
        showToast("Server error!");
    }
}

function showLogin() {
    document.getElementById("registerBox").classList.add("hidden");
    document.getElementById("loginBox").classList.remove("hidden");
}

function renderProducts(data) {
    const grid = document.getElementById("productGrid");
    grid.innerHTML = "";
    data.forEach(product => {
        grid.innerHTML += `
        <div class="card">
            <div class="card-image" onclick="openModal(${product.id})">
                <img src="${product.image}" alt="${product.title}">
            </div>
            <div class="card-body">
                <p class="game">${product.game}</p>
                <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;">
                    ${product.discount ? `<span style="background:#ef4444; padding:5px 10px; border-radius:20px; font-size:11px; font-weight:bold;">${product.discount}</span>` : ""}
                    ${product.status ? `<span style="background:#22c55e; padding:5px 10px; border-radius:20px; font-size:11px; font-weight:bold;">${product.status}</span>` : ""}
                    ${product.badge ? `<span style="background:#3b82f6; padding:5px 10px; border-radius:20px; font-size:11px; font-weight:bold;">${product.badge}</span>` : ""}
                </div>
                <div style="margin-top:10px; color:#facc15; font-size:14px;">${product.rating || ""}</div>
                <h3 class="card-title">${product.title}</h3>
                <p class="price">Rp ${product.price.toLocaleString("id-ID")}</p>
                <button onclick="addToCart(${product.id})">Tambah ke Cart</button>
            </div>
        </div>`;
    });
}

function searchProduct() {
    const keyword = document.getElementById("searchInput").value.toLowerCase();
    const selectedGame = document.getElementById("gameFilter").value;
    
    const filtered = products.filter(product => {
        const matchesKeyword = product.title.toLowerCase().includes(keyword);
        const matchesGame = (selectedGame === "ALL" || product.game === selectedGame);
        return matchesKeyword && matchesGame;
    });
    
    renderProducts(filtered);
}

// Menghitung jumlah total item di dalam badge keranjang belanja secara berkala
function updateCartBadge() {
    const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
    document.getElementById("cartCount").innerText = totalItems;
}

function addToCart(id) {
    const item = products.find(product => product.id === id);
    // Cek apakah produk tersebut sudah ada di keranjang sebelumnya
    const existingItem = cart.find(cartItem => cartItem.id === id);

    if (existingItem) {
        existingItem.quantity += 1; // Jika ada, tambahkan kuantitasnya saja
    } else {
        cart.push({ ...item, quantity: 1 }); // Jika belum ada, masukkan objek baru dengan quantity = 1
    }

    updateCartBadge();
    showToast("Produk ditambahkan!");
}

function showHome() {
    document.getElementById("homePage").style.display = "block";
    document.getElementById("cartPage").style.display = "none";
}

function showCart() {
    document.getElementById("homePage").style.display = "none";
    document.getElementById("cartPage").style.display = "block";
    renderCart();
}

// LOOPING BARU: Render list keranjang belanja lengkap dengan fitur Tambah & Kurang kuantitas
function renderCart() {
    const list = document.getElementById("cartList");
    list.innerHTML = "";
    let total = 0;

    cart.forEach((item, index) => {
        const subtotal = item.price * item.quantity;
        total += subtotal;
        
        list.innerHTML += `
        <div class="cart-item">
            <div>
                <h4>${item.title}</h4>
                <small>${item.game}</small>
                <div class="qty-control">
                    <button class="qty-btn" onclick="minusCart(${index})">-</button>
                    <span class="qty-number">${item.quantity}</span>
                    <button class="qty-btn" onclick="plusCart(${index})">+</button>
                </div>
            </div>
            <div style="text-align: right;">
                Rp ${subtotal.toLocaleString("id-ID")}
                <br><br>
                <button onclick="removeCart(${index})" style="background:red; color:white; border:none; padding:6px 10px; border-radius:6px; cursor:pointer;">Hapus</button>
            </div>
        </div>`;
    });
    document.getElementById("totalPrice").innerText = "Rp " + total.toLocaleString("id-ID");
}

// Fungsi tombol (+) di halaman keranjang
function plusCart(index) {
    cart[index].quantity += 1;
    updateCartBadge();
    renderCart();
}

// Fungsi tombol (-) di halaman keranjang
function minusCart(index) {
    if (cart[index].quantity > 1) {
        cart[index].quantity -= 1;
    } else {
        // Jika kuantitas tersisa 1 lalu dikurangi lagi, otomatis hapus dari list belanja
        cart.splice(index, 1);
        showToast("Produk dihapus!");
    }
    updateCartBadge();
    renderCart();
}

function removeCart(index) {
    cart.splice(index, 1);
    updateCartBadge();
    renderCart();
    showToast("Produk dihapus!");
}

async function checkout() {
    if (cart.length === 0) {
        showToast("Cart kosong!");
        return;
    }
    // Perhitungan total harga final dikalikan dengan quantity masing-masing agar sinkron ke Midtrans
    const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
    document.getElementById("loading").style.display = "flex";

    try {
        const response = await fetch("http://localhost:3000/token", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ total: total })
        });

        const data = await response.json();

        if (!response.ok || !data.token) {
            document.getElementById("loading").style.display = "none";
            showToast(data.error || "Gagal mendapatkan token transaksi!");
            return; 
        }
        
        snap.pay(data.token, {
            onSuccess: function() {
                document.getElementById("loading").style.display = "none";
                showToast("Pembayaran berhasil!");
                cart = [];
                renderCart();
                document.getElementById("cartCount").innerText = 0;
                showHome();
            },
            onPending: function() {
                document.getElementById("loading").style.display = "none";
                showToast("Menunggu pembayaran");
            },
            onError: function() {
                document.getElementById("loading").style.display = "none";
                showToast("Pembayaran gagal");
            },
            onClose: function() { 
                document.getElementById("loading").style.display = "none";
                showToast("Pembayaran dibatalkan");
            }
        });
    } catch (error) {
        document.getElementById("loading").style.display = "none";
        console.log("Error detail:", error);
        showToast("Tidak bisa terhubung ke server!");
    }
}

function logout() {
    localStorage.removeItem("isLogin");
    location.reload();
}

function showToast(message) {
    const toast = document.getElementById("toast");
    toast.innerText = message;
    toast.classList.add("show");
    setTimeout(() => {
        toast.classList.remove("show");
    }, 2000);
}

function openModal(id) {
    const product = products.find(item => item.id === id);
    document.getElementById("productModal").style.display = "flex";
    document.getElementById("modalImg").src = product.image;
    document.getElementById("modalTitle").innerText = product.title;
    document.getElementById("modalGame").innerText = product.game;
    document.getElementById("modalPrice").innerText = "Rp " + product.price.toLocaleString("id-ID");
    document.getElementById("buyNowBtn").onclick = function() {
        addToCart(product.id);
        closeModal();
    };
}

function closeModal() {
    document.getElementById("productModal").style.display = "none";
}
</script>
